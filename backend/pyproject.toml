[project]
name = "health-trajectory-backend"
version = "0.1.0"
description = "FastAPI backend for a research health trajectory prototype"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic", "pydantic-settings", "sqlalchemy", "psycopg[binary]", "python-multipart", "pymupdf"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
